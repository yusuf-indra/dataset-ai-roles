ext_included","ma":false,"roles":["Real-Time Writing Assistance (RTWA)","Automated Writing Evaluation (AWE)"],"srl":["[P3] Real-time Correction","[P4] Summarizing Performance Trends","[P4] Updating Learner Profile"],"country_display":"China","id":"1716"},{"title":"Revising with Intelligence: ChatGPT Feedback and Its Impact on EFL Students’ Revision and Self-Efficacy","year":"2025","authors":"Yang, Y.; Hussin, S.; Hashim, H.","doi":"10.30564/fls.v7i7.9845","stage":"fulltext_excluded","ma":false,"roles":["Conversational Agent / Chatbot"],"srl":[],"country_display":"Malaysia","id":"1717"},{"title":"The role of generative AI and hybrid feedback in improving L2 writing skills: a comparative study","year":"2025","authors":"Zhang, Z.; Aubrey, S.; Huang, X.; Chiu, T.K.F.","doi":"10.1080/17501229.2025.2503890","stage":"fulltext_included","ma":false,"roles":["Automated Writing Evaluation (AWE)"],"srl":["[P3] Revision Guidance"],"country_display":"China","id":"1718"}]}</script><script>
(()=>{const data=JSON.parse(document.getElementById('dataset').textContent).papers,full=data.filter(r=>r.stage==='fulltext_included'),nav=document.querySelector('#nav'),main=document.querySelector('#main');const roles=['Automated Writing Evaluation (AWE)','Generative Writing Assistant','Real-Time Writing Assistance (RTWA)','Conversational Agent / Chatbot','Intelligent Tutoring System (ITS) / Adaptive Recommender','AI-Assisted Peer Feedback','Other'],short=['AWE','GWA','RTWA','CAC','ITS','AAPF','Other'],phases=['Task Definition','Goal Setting and Planning','Enactment','Adaptation'],colors=['#ef959b','#fac995','#8dd4ee','#f6ed9d'];const chartNames=['Publication Year','Country / Region','AI Roles','SRL Phases','AI-Supported SRL Activities','Phase Combinations','AI Roles × SRL Phases'];let page='Paper List',step=0,role=0,phase=0,impl='all',chart=0,q='',year='all',offset=0,limit=25,sel=null,detail='Overview';const E=x=>String(x??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=n=>n.toLocaleString('en-US');const pass=(r,i)=>i===0||i===1&&r.stage!=='abstract_excluded'||i===2&&r.stage==='fulltext_included'||i===3&&r.stage==='fulltext_included'&&r.ma===true;const ps=r=>[...new Set(r.srl.map(x=>x.match(/^\[(P[1-4])\]/)?.[1]).filter(Boolean))].sort();const count=(arr,fn)=>Object.entries(arr.reduce((a,r)=>{let k=fn(r);a[k]=(a[k]||0)+1;return a},Object.create(null)));const steps=[0,1,2,3].map(i=>data.filter(r=>pass(r,i)).length),rc=roles.map(s=>full.filter(r=>r.roles.includes(s)).length),pc=phases.map((_,i)=>full.filter(r=>ps(r).includes('P'+(i+1))).length);const implementations=count(full.flatMap(r=>[...new Set(r.srl)]),s=>s).sort((a,b)=>a[0].slice(0,4).localeCompare(b[0].slice(0,4))||b[1]-a[1]);const reset=()=>{offset=0;sel=null;q='';year='all'};const tabs=(names,ns,active,key)=>`<div class="tabs">${names.map((s,i)=>`<button data-${key}="${i}" class="${i===active?'active':''}">${E(s)}<b>${fmt(ns[i])}</b></button>`).join('')}</div>`;const info=["This chart shows the number of included studies published each year. Research activity increased sharply from 2022 onward, with 159 studies (78.3%) published in 2024 and 2025. This coincides with the wider availability of large language models. (Figure 2, p. 40)", "This chart shows the geographical distribution of included studies. China contributed the largest number (54; 26.6%), followed by Iran, Indonesia and Saudi Arabia. Countries with one study each are grouped as Others. (Figure 3, p. 41)", "This chart shows how frequently each AI role was identified in the included studies. AWE was the most common role, followed by GWA and RTWA. A study may be classified under more than one AI role; percentages therefore need not sum to 100%. RTWA is the updated label for Automated Formative Feedback. Two studies retain the residual Other code. (Figure 5, pp. 46–47)", "This chart shows the number of studies implementing AI to support each phase of self-regulated learning. Enactment is the most frequently supported phase, while task definition receives little attention. A study may support more than one SRL phase and is counted once within each relevant phase. (Section 4.2.1, pp. 42–44)", "This chart shows specific AI-supported learning and writing activities, grouped by SRL phase. A study may support several phases and several activities within each phase. Revision guidance is the most frequently reported activity. Each bar counts the studies coded for that activity. The legacy practice-related categories are shown separately because the grouped AI-Generated Practice count in the manuscript has not yet been reconciled. (Figure 4, p. 45)", "This table shows the combinations of SRL phases supported in the included studies. Each study belongs to one combination. Most studies support a single phase, and none support all four. (Table 1, p. 43)", "This table shows the number of studies in which each AI role and SRL phase co-occur. Enactment is the most frequently supported phase across all AI roles, while task definition receives considerably less attention. Studies may involve multiple AI roles and support multiple SRL phases. Multiple roles refers to studies using at least two of the six AI roles defined in the manuscript; Other is shown separately. Because roles and phases were coded separately, co-occurrence does not establish that a particular role directly supported that phase. These counts replace the estimated values only if the table is interpreted as study-level co-occurrence. (Table 2, p. 47)"];
function render(){nav.innerHTML=['Paper List','AI Roles','SRL Phases','Charts'].map(n=>`<button data-page="${n}" class="${page===n?'active':''}">${n}</button>`).join('');let h=`<h2>${page}</h2>`;if(page==='Charts'){main.innerHTML=h+`<div class="tools" style="padding-left:0">${chartNames.map((s,i)=>`<button data-chart="${i}" class="${chart===i?'active':''}">${E(s)}</button>`).join('')}</div><div class="panel chart" id="chart"></div>`;drawChart();return}if(page==='Paper List')h+=tabs(['All Papers','Abstract Included','Full-text Included','Meta-analysis Included'],steps,step,'step');if(page==='Paper List'&&step===3)h+='<div class="note">This list shows the 94 studies selected for meta-analysis in the current research dataset.</div>';if(page==='AI Roles')h+=tabs(short,rc,role,'role')+`<h3>${E(roles[role])}</h3><div class="note">This page lists studies by AI role. A study may be classified under more than one role. RTWA replaces the legacy Automated Formative Feedback label; Other is retained for coding review.</div>`;if(page==='SRL Phases')h+=`<div class="note">This page lists studies using AI to support each SRL phase. Select a phase or an activity within it. A study may support multiple phases and multiple activities.</div>`+tabs(phases.map((s,i)=>`P${i+1} · ${s}`),pc,phase,'phase')+`<div><button data-impl="all" class="chip ${impl==='all'?'active':''}">All activities</button>${implementations.filter(a=>a[0].startsWith('[P'+(phase+1)+']')).map(([s,n])=>`<button class="chip ${impl===s?'active':''}" data-impl="${E(s)}">${E(s.slice(5))} (${n})</button>`).join('')}</div>`;main.innerHTML=h+`<div class="panel"><div class="tools"><input type="search" id="q" placeholder="Search title, author or DOI" value="${E(q)}"><select id="yr"><option value="all">All years</option>${[...new Set(data.map(r=>String(r.year)))].sort().reverse().map(y=>`<option ${year===y?'selected':''}>${E(y)}</option>`).join('')}</select></div><div id="table" class="scroll"></div></div><div id="detail"></div>`;drawTable();drawDetail()}
function rows(){return data.filter(r=>(page==='Paper List'?pass(r,step):page==='AI Roles'?pass(r,2)&&r.roles.includes(roles[role]):pass(r,2)&&ps(r).includes('P'+(phase+1))&&(impl==='all'||r.srl.includes(impl)))&&(year==='all'||String(r.year)===year)&&`${r.title} ${r.authors||''} ${r.doi||''}`.toLowerCase().includes(q.toLowerCase()))}
function drawTable(){let a=rows(),simple=page!=='Paper List',status=v=>v===null?'—':`<span class="${v?'yes':'no'}">${v?'Yes':'No'}</span>`;document.querySelector('#table').innerHTML=`<table><thead><tr><th>No.</th><th>Paper title${simple?'':' / Authors'}</th><th>Year</th>${simple?'':'<th>Abstract</th><th>Full text</th><th>MA</th>'}</tr></thead><tbody>${a.slice(offset,offset+limit).map((r,i)=>`<tr><td>${offset+i+1}</td><td><button data-paper="${E(r.id)}">${E(r.title)}</button>${simple?'':`<div class="muted">${E(r.authors||'')}</div>`}</td><td>${E(r.year)}</td>${simple?'':`<td>${status(pass(r,1))}</td><td>${status(pass(r,1)?pass(r,2):null)}</td><td>${status(pass(r,2)?r.ma:null)}</td>`}</tr>`).join('')||`<tr><td colspan="${simple?3:6}">No matching papers.</td></tr>`}</tbody></table><div class="tools"><span class="muted">${a.length?offset+1:0}–${Math.min(offset+limit,a.length)} of ${fmt(a.length)} papers</span><span style="flex:1"></span><button data-prev ${offset===0?'disabled':''}>Previous</button><button data-next ${offset+limit>=a.length?'disabled':''}>Next</button><select id="limit">${[10,25,50,100].map(n=>`<option ${n===limit?'selected':''}>${n}</option>`).join('')}</select></div>`}
function drawDetail(){let d=document.querySelector('#detail');if(!sel){d.innerHTML='';return}let r=sel;let body=detail==='Overview'?`<p>${E(r.authors)}</p><p>See the linked publication for the abstract and full text.</p>`:detail==='Screening'?`<p>Abstract included: ${pass(r,1)} · Full text included: ${pass(r,2)} · MA selected: ${r.ma}</p>`:detail==='AI Roles'?`<p>${E(r.roles.join('; '))}</p>`:detail==='SRL Phases'?`<p>${E(r.srl.join('; '))}</p>`:'<p class="muted">Original extraction values and evidence are preserved for traceability; display labels in the category views use the updated terminology.</p>'+Object.entries(r.extraction||{}).map(([k,v])=>`<details><summary>${E(k)}: ${E(typeof v?.value==='object'?JSON.stringify(v.value):v?.value)}</summary><p>${E(v?.evidence||'')}</p></details>`).join('');d.innerHTML=`<div class="panel detail"><button data-close style="float:right">Close</button><small>Publication year: ${E(r.year)}</small><h3>${E(r.title)}</h3>${[['DOI',r.doi],['PDF',r.pdf]].filter(a=>/^https?:\/\//i.test(a[1]||'')).map(a=>`<a href="${E(a[1])}" target="_blank" rel="noopener noreferrer">${a[0]}</a> `).join('')}<div class="tools" style="padding-left:0">${['Overview','Screening','AI Roles','SRL Phases'].map(s=>`<button data-detail="${s}" class="${detail===s?'active':''}">${s}</button>`).join('')}</div>${body}</div>`}
function drawChart(){let b=document.querySelector('#chart'),pairs=[],html='';if(chart===0){let a=Array.from({length:10},(_,i)=>[2016+i,full.filter(r=>+r.year===2016+i).length]),x=i=>75+i*67,y=n=>245-n*2;html=`<svg viewBox="0 0 750 320" width="100%"><g font-family="Georgia,serif" font-size="13">${[0,20,40,60,80,100].map(n=>`<line x1="45" x2="720" y1="${y(n)}" y2="${y(n)}" stroke="#c6c6c6"/><text x="38" y="${y(n)+4}" text-anchor="end">${n}</text>`).join('')}${a.map(([yr,n],i)=>`<line x1="${x(i)}" x2="${x(i)}" y1="25" y2="245" stroke="#d0d0d0"/><text x="${x(i)}" y="263" text-anchor="end" transform="rotate(-45 ${x(i)} 263)">${yr}</text>`).join('')}<rect x="45" y="25" width="675" height="220" fill="none" stroke="#333"/><polyline points="${a.map((r,i)=>`${x(i)},${y(r[1])}`).join(' ')}" stroke="#0000d8" stroke-width="2.5" fill="none"/>${a.map(([yr,n],i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="4" fill="#0000d8"/><text x="${x(i)}" y="${y(n)-10}" fill="#0000d8" text-anchor="middle">${n}</text>`).join('')}<text x="380" y="310" text-anchor="middle">Year of Publication</text><text transform="translate(13 135) rotate(-90)" text-anchor="middle">Number of Studies</text></g></svg>`}if(chart===1){let a=count(full,r=>r.country_display);pairs=a.filter(r=>r[1]>1&&r[0]!=='Unspecified/Multiple').sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));pairs.push(['Others',a.filter(r=>r[1]===1).length],['Unspecified/Multiple',a.find(r=>r[0]==='Unspecified/Multiple')?.[1]||0])}if(chart===2)pairs=roles.map((s,i)=>[s,rc[i]]);if(chart===3)pairs=phases.map((s,i)=>[s,pc[i],colors[i]]);if(chart===4)pairs=implementations.map(([s,n])=>[s,n,colors[+s[2]-1]]);if(chart===5){let a=count(full,r=>ps(r).join(' + '));html=`<table><thead><tr><th>Combination level</th><th>Phases</th><th>Studies</th></tr></thead><tbody>${[1,2,3,4].map(i=>{let z=a.filter(r=>r[0]&&r[0].split(' + ').length===i);return `<tr><td><b>${['Single phase','Two phases','Three phases','Four phases'][i-1]}</b></td><td></td><td><b>${z.reduce((n,r)=>n+r[1],0)}</b></td></tr>`+z.map(([s,n])=>`<tr><td></td><td>${s}</td><td>${n}</td></tr>`).join('')}).join('')}<tr><td><b>Total</b></td><td></td><td>203</td></tr></tbody></table>`}if(chart===6){let order=['AWE','RTWA','GWA','CAC','ITS','AAPF','Other'];let a=order.map(k=>[k,...phases.map((_,j)=>full.filter(r=>r.roles.includes(roles[short.indexOf(k)])&&ps(r).includes('P'+(j+1))).length)]);a.push(['Multiple roles (≥2)',...phases.map((_,j)=>full.filter(r=>new Set(r.roles.filter(v=>roles.includes(v)&&v!=='Other')).size>=2&&ps(r).includes('P'+(j+1))).length)]);html=`<div class="scroll"><table class="matrix"><thead><tr><th>AI role</th><th scope="col"><strong>Task<br>Definition</strong></th><th scope="col"><strong>Goal Setting<br>and Planning</strong></th><th>Enactment</th><th>Adaptation</th></tr></thead><tbody>${a.map(r=>`<tr>${r.map((v,i)=>i===0?`<td>${E(v)}</td>`:`<td style="background:rgba(129,120,205,${v/203*.22})">${E(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}if(chart===4){let max=Math.max(1,...implementations.map(a=>a[1]));html=phases.map((name,i)=>{let z=implementations.filter(a=>a[0].startsWith('[P'+(i+1)+']'));return `<section style="margin:20px 0"><h3 style="border-left:5px solid ${colors[i]};padding-left:10px">P${i+1} · ${E(name)}</h3>${z.map(([label,n])=>`<div class="bar"><span style="text-align:right">${E(label.slice(5))}</span><div class="track"><div class="fill" style="width:${100*n/max}%;background:${colors[i]}"></div></div><span>${n}</span></div>`).join('')}</section>`}).join('')+`<p class="muted" style="text-align:center">Number of studies · common scale across phases</p>`;pairs=[]}if(pairs.length){let max=Math.max(...pairs.map(r=>r[1]),1);html=pairs.map(([s,n,c])=>`<div class="bar"><span style="text-align:right">${E(s)}</span><div class="track"><div class="fill" style="width:${100*n/max}%;background:${c||'#aaa5ef'}"></div></div><span>${n}${chart===2?' ('+(100*n/203).toFixed(1)+'%)':''}</span></div>`).join('')+'<p class="muted" style="text-align:center">Number of studies</p>'}b.innerHTML=`<h3>${chartNames[chart]} (N = 203)</h3>${html}<div class="note"><b>Interpretation</b><p>${info[chart]}</p></div>`}
// Delegated events survive replacement of all child nodes during rendering.
document.querySelector('#app').addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if('page'in d){page=d.page;reset();render()}else if('step'in d){step=+d.step;reset();render()}else if('role'in d){role=+d.role;reset();render()}else if('phase'in d){phase=+d.phase;impl='all';reset();render()}else if('impl'in d){impl=d.impl;reset();render()}else if('chart'in d){chart=+d.chart;render()}else if('paper'in d){sel=data.find(r=>String(r.id)===d.paper);detail='Overview';drawDetail();document.querySelector('#detail').scrollIntoView({block:'nearest'})}else if('close'in d){sel=null;drawDetail()}else if('detail'in d){detail=d.detail;drawDetail()}else if('prev'in d){offset=Math.max(0,offset-limit);drawTable()}else if('next'in d){offset+=limit;drawTable()}});main.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;offset=0;drawTable()}});main.addEventListener('change',e=>{if(e.target.id==='yr'){year=e.target.value;offset=0;drawTable()}if(e.target.id==='limit'){limit=+e.target.value;offset=0;drawTable()}});render()})();
</script></html>
